name: Update News

on:
  schedule:
    - cron: "0 13 1,15 * *"   # 1st and 15th of each month at 13:00 UTC (an hour after publications)
  workflow_dispatch:

permissions:
  contents: write

# Shared with update-publications.yml so the two bots never push at the same time
concurrency:
  group: site-data-bot
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser pyyaml python-dateutil

      - name: Run news fetch script
        run: python assets/python/fetch_news.py
        working-directory: ${{ github.workspace }}

      - name: Commit updated news
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add _data/news.yml
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update news"
          git pull --rebase
          git push
